# proton bundle layer: mounts the composition runtime into the profile that has
# this bundle installed, so `dsh plugin add dsh-proton` is the whole install.
#
# A deployer that wants another id or its own config overrides this row by
# writing the same id in the profile's cordis.patch.yml: a later layer wins by
# id, so the entry stays unique and profile-owned either way.
- insert:
    - id: proton
      name: dsh-proton
