name: vendor-upstream

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag（留空 = 最新的 dsh-v*）'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 解析目标 tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(node -p "require('./packages/workspace-seat/vendor/PROVENANCE.json').tag")
          latest=$(curl -fsSL \
            'https://api.github.com/repos/deepseek-ai/deepseek-harness/tags?per_page=100' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).map(x=>x.name).filter(n=>n.startsWith('dsh-v')).sort();process.stdout.write(t[t.length-1]||'')})")
          echo "current=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$current" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor
        if: steps.tag.outputs.skip != 'true'
        run: node scripts/vendor-upstream.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: 装依赖并验证构建
        if: steps.tag.outputs.skip != 'true'
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm --filter dsh-proton-workspace-seat build

      - uses: peter-evans/create-pull-request@v6
        if: steps.tag.outputs.skip != 'true'
        with:
          branch: vendor/upstream-${{ steps.tag.outputs.tag }}
          title: 'vendor(upstream): ${{ steps.tag.outputs.tag }}'
          commit-message: 'vendor: bump ui-workspace to ${{ steps.tag.outputs.tag }}'
          body: |
            自动同步 `packages/client/ui-workspace` 到 `${{ steps.tag.outputs.tag }}`。

            补丁若冲突，Re-vendor 这一步会失败、不会开 PR —— 需要人工裁决后重新生成补丁。
            构建若失败，同样不会开 PR：vendor 换了但代码不适配，等于没适配。
