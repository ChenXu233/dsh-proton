# 发布工作流：推送 v* tag 时把三个包发布到 npm。
#
# 一次性配置（二选一）：
# 1. 经典方案：Settings → Secrets → NPM_TOKEN（Granular Access Token，勾 publish，勾 Bypass 2FA）。
# 2. 推荐：包发布后，在 npmjs 为每个包配置 Trusted Publisher（repository=本仓库，workflow=release.yml），
#    之后删掉 NODE_AUTH_TOKEN，改用 pnpm publish --provenance 走 OIDC。
#
# tag 必须与三个包的 version 一致（例如 v0.1.0），否则工作流在发布前失败。
# 发布按「依赖顺序逐包」进行，registry 上已存在的版本单独跳过——因此重跑、
# 或某个包先发/后发造成的部分发布状态，都不会让整批失败。

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试
        run: pnpm test

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 校验 tag 与包版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            if [ "$v" != "$tag" ]; then
              echo "::error file=$p::version $v 与 tag $tag 不一致"
              fail=1
            fi
          done
          exit $fail

      - name: 按依赖顺序发布（已存在的版本跳过）
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # 依赖顺序：core → adapter-dsh → workspace。新增包时按拓扑顺序补进这个列表。
          for dir in packages/core packages/adapter-dsh packages/workspace; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$tag" version >/dev/null 2>&1; then
              echo "$name@$tag 已存在，跳过"
            else
              echo "发布 $name@$tag"
              (cd "$dir" && pnpm publish --access public --no-git-checks)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
