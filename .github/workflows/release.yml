# 发布工作流：推送 v* tag 时把三个包发布到 npm（OIDC 可信发布，不保存任何 token）。
#
# npm 侧已配置 Trusted Publisher：
#   repository = ChenXu233/dsh-proton
#   workflow   = release.yml
#   permissions= publish, stage publish
# 身份由 GitHub OIDC（permissions.id-token: write）换取，故无需 NPM_TOKEN secret。
#
# tag 必须与三个包的 version 一致（例如 v0.1.0），否则在发布前失败。
# 发布按「依赖顺序逐包」进行，registry 上已存在的版本单独跳过——重跑、
# 或某个包先发/后发造成的部分发布状态，都不会让整批失败。
# 手动触发（Actions → release → Run workflow）只做检查与构建，不发布。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的版本号，例如 v0.1.0（手动运行只检查，不发布）'
        required: true
        default: v0.1.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # push 走 tag 名；手动触发走输入值。
      CHECK_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 升级 npm（OIDC 发布需要 >= 11.5）
        run: npm install -g npm@11

      - name: 测试
        run: pnpm test

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 校验 tag 与包版本一致
        run: |
          tag="${CHECK_TAG#v}"
          fail=0
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            if [ "$v" != "$tag" ]; then
              echo "::error file=$p::version $v 与 tag $tag 不一致"
              fail=1
            fi
          done
          exit $fail

      - name: 按依赖顺序发布（已存在的版本跳过，OIDC 可信发布）
        if: github.event_name == 'push'
        run: |
          tag="${CHECK_TAG#v}"
          # 依赖顺序：core → adapter-dsh → workspace。新增包时按拓扑顺序补进这个列表。
          # 用 pnpm pack 生成 tarball（会把 workspace:* 重写成实际版本），
          # 再用 npm publish 发布——pnpm 自身尚未支持 npm 的 OIDC 可信发布。
          for dir in packages/core packages/adapter-dsh packages/workspace; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$tag" version >/dev/null 2>&1; then
              echo "$name@$tag 已存在，跳过"
              continue
            fi
            echo "发布 $name@$tag"
            ( cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null )
            npm publish "$RUNNER_TEMP/$name-$tag.tgz" --access public --provenance
          done
